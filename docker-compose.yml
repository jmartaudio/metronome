services:
  metronome:
    # Built and published by .github/workflows/docker-image.yml on every push to main.
    image: ghcr.io/jmartaudio/metronome:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - "8085:80"
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metronome.entrypoints=http"
      - "traefik.http.routers.metronome.rule=Host(`metronome.local.fuzzhouse.com`)"
      - "traefik.http.middlewares.metronome-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.metronome.middlewares=metronome-https-redirect"
      - "traefik.http.routers.metronome-secure.entrypoints=https"
      - "traefik.http.routers.metronome-secure.rule=Host(`metronome.local.fuzzhouse.com`)"
      - "traefik.http.routers.metronome-secure.tls=true"
      - "traefik.http.routers.metronome-secure.service=metronome"
      - "traefik.http.services.metronome.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true
