<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metronome</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Metronome</h1>
    </header>

    <!-- Tempo -->
    <section class="card tempo">
      <div class="bpm-display">
        <button class="nudge" data-nudge="-1" aria-label="Decrease tempo">−</button>
        <div>
          <span id="bpmValue">120</span>
          <small>BPM</small>
        </div>
        <button class="nudge" data-nudge="1" aria-label="Increase tempo">+</button>
      </div>
      <input id="bpm" type="range" min="20" max="300" value="120" aria-label="Tempo">
      <div class="row">
        <button id="startStop" class="primary">Start</button>
        <button id="tap">Tap tempo</button>
      </div>
      <p class="hint">Space bar starts / stops.</p>
    </section>

    <!-- Beats & accent -->
    <section class="card">
      <h2>Beats &amp; accent</h2>
      <div class="row">
        <label>Beats per bar
          <select id="beats"></select>
        </label>
        <label>Subdivision
          <select id="subdivision">
            <option value="1">None (quarters)</option>
            <option value="2">Eighths (2)</option>
            <option value="3">Triplets (3)</option>
            <option value="4">Sixteenths (4)</option>
            <option value="5">Quintuplets (5)</option>
            <option value="6">Sextuplets (6)</option>
          </select>
        </label>
      </div>
      <p class="hint">Click a beat to put the accent on it.</p>
      <div id="beatGrid" class="beat-grid"></div>
    </section>

    <!-- Levels -->
    <section class="card">
      <h2>Levels</h2>
      <div id="levels" class="levels"></div>
    </section>

    <!-- Tempo ramp -->
    <section class="card">
      <h2>Tempo ramp</h2>
      <label class="switch">
        <input id="rampOn" type="checkbox"> Gradually change tempo
      </label>
      <div class="ramp-grid">
        <label>Target BPM
          <input id="rampTarget" type="number" min="20" max="300" value="160">
        </label>
        <label>Mode
          <select id="rampMode">
            <option value="step">Step: every N bars</option>
            <option value="smooth">Smooth: BPM per minute</option>
          </select>
        </label>
        <label>Change by (BPM)
          <input id="rampAmount" type="number" min="0.1" max="50" step="0.1" value="2">
        </label>
        <label id="rampBarsLabel">Every N bars
          <input id="rampBars" type="number" min="1" max="64" value="4">
        </label>
      </div>
      <p id="rampStatus" class="hint"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
